<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUISEPPE — Chosen by You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #f4f3f1;
      color: #3f4650;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }
    .intro {
      cursor: pointer;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .intro:hover {
      transform: scale(1.03);
    }
    .cross {
      font-size: 70px;
      line-height: 1;
      margin-bottom: 20px;
    }
    .logo {
      font-family: Georgia, serif;
      font-size: clamp(50px, 9vw, 120px);
      font-weight: 400;
      letter-spacing: 3px;
    }
    .tap {
      margin-top: 35px;
      font-size: 11px;
      letter-spacing: 4px;
      opacity: 0.6;
    }
    .concept {
      display: none;
      max-width: 650px;
      animation: fadeIn 0.8s ease forwards;
    }
    .concept h1 {
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 400;
      letter-spacing: 4px;
      margin-bottom: 30px;
    }
    .concept p {
      font-size: 16px;
      line-height: 2;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }
    .enter {
      display: inline-block;
      border: 1px solid #3f4650;
      padding: 14px 35px;
      color: #3f4650;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 3px;
      transition: 0.3s;
    }
    .enter:hover {
      background: #3f4650;
      color: #f4f3f1;
    }
    .home-logo {
      position: fixed;
      top: 25px;
      right: 30px;
      font-family: Georgia, serif;
      font-size: 14px;
      letter-spacing: 2px;
      color: #3f4650;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.3s;
      z-index: 10;
    }
    .home-logo:hover {
      opacity: 1;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="home-logo" onclick="goHome()">GUISEPPE</div>
  <main class="page">
      <div class="intro" id="intro" onclick="showConcept()">
        <div class="cross">†</div>
        <div class="logo">GUISEPPE</div>
        <div class="tap">CLICK TO ENTER</div>
      </div>
      <section class="concept" id="concept">
        <h1>CHOSEN BY YOU.</h1>
        <p>
          Artists submit their designs.<br>
          The community chooses.<br>
          The winners become real.
        </p>
        <a href="#" class="enter" onclick="showComingSoon(); return false;">ENTER</a>
      </section>
      <section class="concept" id="comingsoon">
        <h1>COMING SOON.</h1>
      </section>
    </main>
    <script>
      function showConcept() {
        document.getElementById("intro").style.display = "none";
        document.getElementById("concept").style.display = "block";
      }
      function showComingSoon() {
        document.getElementById("concept").style.display = "none";
        document.getElementById("comingsoon").style.display = "block";
      }
      function goHome() {
        document.getElementById("concept").style.display = "none";
        document.getElementById("comingsoon").style.display = "none";
        document.getElementById("intro").style.display = "flex";
      }
    </script>
</body>
</html>
